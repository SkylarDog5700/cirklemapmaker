<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cirkle - Visual Map Editor</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e23;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 340px;
            background-color: #25252b;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        h2 { margin-top: 0; color: #00bcd4; font-size: 22px; }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label { font-size: 12px; font-weight: bold; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select {
            padding: 8px;
            background: #18181c;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        button {
            padding: 9px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: 0.15s;
        }
        button:hover { background: #444; }
        button.active { background: #00bcd4; color: #000; border-color: #008ba3; }
        button.action-btn { background: #2e7d32; border-color: #1b5e20; }
        button.action-btn:hover { background: #388e3c; }
        button.danger-btn { background: #c62828; border-color: #b71c1c; }
        button.danger-btn:hover { background: #d32f2f; }
        
        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121215;
            position: relative;
            overflow: auto;
            padding: 20px;
        }
        canvas {
            border: 2px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: #87ceeb;
            cursor: crosshair;
            display: block;
        }
        #instructions {
            font-size: 11px;
            background: #18181c;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #00bcd4;
            line-height: 1.4;
            color: #ccc;
        }
        textarea {
            width: 100%;
            height: 110px;
            background: #121215;
            color: #00e676;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 10px;
            resize: none;
            padding: 6px;
            box-sizing: border-box;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Cirkle Map Editor</h2>
        
        <div id="instructions">
            <strong>How to use:</strong><br>
            • <strong>Platforms / Spikes / Goal:</strong> Click & drag on canvas to draw rectangular areas.<br>
            • <strong>Spawn / Power-ups:</strong> Single click on canvas to place them instantly.
        </div>

        <div class="control-group">
            <label>Map ID (Filename)</label>
            <input type="text" id="mapId" value="custom_map_01" oninput="updateMetadata()">
        </div>

        <div class="control-group">
            <label>Map Display Name</label>
            <input type="text" id="mapName" value="My Custom Mod Map" oninput="updateMetadata()">
        </div>

        <div class="control-group">
            <label>Biome Theme</label>
            <select id="mapBiome" onchange="updateCanvasBackground()">
                <option value="Normal">Normal (Sky Blue / Red Spikes)</option>
                <option value="Snowy">Snowy (Ice / Icicles)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Select Tool / Brush</label>
            <div class="tool-grid">
                <button class="active" onclick="setTool('wall')" id="btn-wall">Platform</button>
                <button onclick="setTool('spike')" id="btn-spike">Spike/Icicle</button>
                <button onclick="setTool('start')" id="btn-start">Spawn Pos</button>
                <button onclick="setTool('goal')" id="btn-goal">Goal Zone</button>
                <button onclick="setTool('jumpboost')" id="btn-jumpboost">Jump Boost</button>
                <button onclick="setTool('drp23')" id="btn-drp23">Dr P23 Can</button>
            </div>
        </div>

        <button class="danger-btn" onclick="clearMap()">Clear All Elements</button>

        <div class="control-group">
            <label>Live JSON Output</label>
            <textarea id="jsonOutput" readonly></textarea>
        </div>

        <button class="action-btn" onclick="exportJsonFile()">Download map.json</button>
    </div>

    <div id="canvas-container">
        <canvas id="editorCanvas" width="1000" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');

        let currentTool = 'wall';
        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentMouseX = 0, currentMouseY = 0;

        let mapData = {
            id: "custom_map_01",
            name: "My Custom Mod Map",
            biome: "Normal",
            startPosition: { x: 100, y: 600 },
            goalZone: { x: 900, y: 100, width: 80, height: 80 },
            walls: [
                { x: 0, y: 660, width: 1000, height: 40 }
            ],
            spikes: [],
            powerUps: []
        };

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-grid button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tool).classList.add('active');
        }

        function updateMetadata() {
            mapData.id = document.getElementById('mapId').value.trim() || 'custom_map';
            mapData.name = document.getElementById('mapName').value.trim() || 'Unnamed Map';
            updateJsonPreview();
        }

        function updateCanvasBackground() {
            mapData.biome = document.getElementById('mapBiome').value;
            redraw();
        }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            // Account for CSS scaling if canvas size differs from internal resolution
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const coords = getCanvasCoordinates(e);
            startX = coords.x;
            startY = coords.y;
            currentMouseX = coords.x;
            currentMouseY = coords.y;

            // Instant placement tools (single click)
            if (currentTool === 'start') {
                mapData.startPosition = { x: Math.round(startX), y: Math.round(startY) };
                redraw();
                return;
            }

            isDrawing = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            const coords = getCanvasCoordinates(e);
            currentMouseX = coords.x;
            currentMouseY = coords.y;

            if (!isDrawing) return;
            redraw();
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;

            const coords = getCanvasCoordinates(e);
            let endX = coords.x;
            let endY = coords.y;

            let x = Math.min(startX, endX);
            let y = Math.min(startY, endY);
            let w = Math.max(12, Math.abs(endX - startX));
            let h = Math.max(12, Math.abs(endY - startY));

            if (currentTool === 'wall') {
                mapData.walls.push({ x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) });
            } else if (currentTool === 'spike') {
                mapData.spikes.push({ x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) });
            } else if (currentTool === 'goal') {
                mapData.goalZone = { x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) };
            } else if (currentTool === 'jumpboost') {
                mapData.powerUps.push({ type: 'JumpBoost', x: Math.round(startX - 12), y: Math.round(startY - 12), width: 24, height: 24 });
            } else if (currentTool === 'drp23') {
                mapData.powerUps.push({ type: 'DrP23', x: Math.round(startX - 12), y: Math.round(startY - 12), width: 24, height: 24 });
            }

            redraw();
        });

        canvas.addEventListener('mouseleave', () => {
            if (isDrawing) {
                isDrawing = false;
                redraw();
            }
        });

        function clearMap() {
            if (confirm("Clear all elements from the map?")) {
                mapData.walls = [];
                mapData.spikes = [];
                mapData.powerUps = [];
                redraw();
            }
        }

        function updateJsonPreview() {
            document.getElementById('jsonOutput').value = JSON.stringify(mapData, null, 2);
        }

        function redraw() {
            // Background color based on biome
            if (mapData.biome === 'Snowy') {
                ctx.fillStyle = '#c8dcf5';
            } else {
                ctx.fillStyle = '#87ceeb';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Goal Zone
            ctx.fillStyle = 'rgba(40, 220, 80, 0.45)';
            ctx.fillRect(mapData.goalZone.x, mapData.goalZone.y, mapData.goalZone.width, mapData.goalZone.height);
            ctx.strokeStyle = '#00cc44';
            ctx.lineWidth = 2;
            ctx.strokeRect(mapData.goalZone.x, mapData.goalZone.y, mapData.goalZone.width, mapData.goalZone.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Segoe UI';
            ctx.fillText('GOAL ZONE', mapData.goalZone.x + 8, mapData.goalZone.y + 20);

            // 2. Platforms (Walls)
            mapData.walls.forEach(w => {
                ctx.fillStyle = (mapData.biome === 'Snowy') ? '#d2e6f5' : '#50505a';
                ctx.fillRect(w.x, w.y, w.width, w.height);
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(w.x, w.y, w.width, w.height);

                if (mapData.biome === 'Snowy') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(w.x, w.y, w.width, 6); // Snowy cap
                }
            });

            // 3. Spikes or Icicles
            if (mapData.biome === 'Snowy') {
                ctx.fillStyle = '#dcf5ff';
                ctx.strokeStyle = '#5a92a5';
            } else {
                ctx.fillStyle = '#dc143c';
                ctx.strokeStyle = '#8b0000';
            }

            mapData.spikes.forEach(s => {
                let toothWidth = mapData.biome === 'Snowy' ? 16 : 20;
                let numTeeth = Math.max(1, Math.floor(s.width / toothWidth));
                let actualToothWidth = s.width / numTeeth;

                for (let i = 0; i < numTeeth; i++) {
                    let leftX = s.x + (i * actualToothWidth);
                    let rightX = leftX + actualToothWidth;
                    let midX = leftX + (actualToothWidth / 2);

                    ctx.beginPath();
                    ctx.moveTo(leftX, s.y + s.height);
                    ctx.lineTo(midX, s.y);
                    ctx.lineTo(rightX, s.y + s.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    if (mapData.biome === 'Snowy') {
                        ctx.strokeStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.moveTo(midX, s.y + 2);
                        ctx.lineTo(midX, s.y + s.height - 4);
                        ctx.stroke();
                        ctx.strokeStyle = '#5a92a5';
                    }
                }
            });

            // 4. Power-ups
            mapData.powerUps.forEach(p => {
                if (p.type === 'JumpBoost') {
                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(p.x + 12, p.y + 12, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#008b8b';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText('JB', p.x + 4, p.y + 16);
                } else if (p.type === 'DrP23') {
                    ctx.fillStyle = '#800000';
                    ctx.fillRect(p.x, p.y, 24, 24);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, 24, 24);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 9px Arial';
                    ctx.fillText('P23', p.x + 2, p.y + 15);
                }
            });

            // 5. Spawn Position Marker
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(mapData.startPosition.x, mapData.startPosition.y, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 10px Arial';
            ctx.fillText('START', mapData.startPosition.x - 16, mapData.startPosition.y - 18);

            // 6. Active Drawing Preview Box
            if (isDrawing && currentTool !== 'start') {
                let x = Math.min(startX, currentMouseX);
                let y = Math.min(startY, currentMouseY);
                let w = Math.abs(currentMouseX - startX);
                let h = Math.abs(currentMouseY - startY);

                ctx.strokeStyle = '#00bcd4';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);

                if (currentTool === 'jumpboost' || currentTool === 'drp23') {
                    ctx.strokeRect(startX - 12, startY - 12, 24, 24);
                } else {
                    ctx.strokeRect(x, y, w, h);
                }
                ctx.setLineDash([]);
            }

            updateJsonPreview();
        }

        function exportJsonFile() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mapData, null, 2));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", (mapData.id || "map") + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Initial render on load
        redraw();
    </script>
</body>
</html>
